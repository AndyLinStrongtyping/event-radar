services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: event_radar
      POSTGRES_PASSWORD: event_radar
      POSTGRES_DB: event_radar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - event_radar_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_radar -d event_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  event_radar_data:
