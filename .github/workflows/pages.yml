name: 部署展館雷達快速前端

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 建置靜態前端
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 建置 GitHub Pages 前端
        env:
          VITE_BASE_PATH: /event-radar/
          VITE_API_BASE_URL: https://event-radar-preview.onrender.com
          VITE_CANONICAL_URL: https://event-radar-preview.onrender.com/
          VITE_GA4_ID: G-HMD9YGX1X3
          VITE_NOINDEX: 'true'
        run: npm run build:web
      - name: 複製公開圖片
        run: cp -R web/assets web/react-build/assets
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上傳靜態網站
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/react-build

  deploy:
    name: 發布靜態前端
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
