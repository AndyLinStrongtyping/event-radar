name: 每週博物館特展同步

on:
  schedule:
    - cron: '15 4 * * 2'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-radar-weekly-sync
  cancel-in-progress: false

jobs:
  sync-nmns:
    name: 同步科博館
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NMNS_API_KEY: ${{ secrets.NMNS_API_KEY }}
      NMNS_OPEN_DATA_URL: ${{ secrets.NMNS_OPEN_DATA_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入科博館官方特展
        run: npm run jobs:scheduled -- --source nmns
  sync-npm-south:
    name: 同步故宮南院
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入故宮南院官方展覽
        run: npm run jobs:scheduled -- --source npm-south

  sync-npm-north:
    name: 同步故宮北院
    # Cloud runners currently cannot fetch the official North Branch endpoint.
    # Keep this source independently gated until a cloud run succeeds.
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' && vars.EVENT_RADAR_NPM_NORTH_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入故宮北院官方展覽
        run: npm run jobs:scheduled -- --source npm-north

  sync-nmmba:
    name: 同步海生館
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入海生館官方特展
        run: npm run jobs:scheduled -- --source nmmba

  sync-nstm:
    name: 同步科工館
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入科工館官方展覽
        run: npm run jobs:scheduled -- --source nstm

  sync-ntmofa:
    name: 同步國美館
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入國美館官方展覽
        run: npm run jobs:scheduled -- --source ntmofa

  sync-ntt:
    name: 同步歌劇院節目與場次
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 排程匯入歌劇院官方節目
        run: npm run sync:domain -- --source ntt
