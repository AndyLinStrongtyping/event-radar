name: 檢查奇美特展連結

on:
  schedule:
    # Monday 09:20 Asia/Taipei (GitHub Actions cron uses UTC).
    - cron: '20 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 奇美官方連結核對
    if: ${{ vars.EVENT_RADAR_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 檢查奇美官方特展連結
        run: npm run check:chimei
