name: 驗證 Event Radar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 程式與資料庫測試
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: event_radar
          POSTGRES_PASSWORD: event_radar
          POSTGRES_DB: event_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_radar -d event_radar"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://event_radar:event_radar@localhost:5432/event_radar
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 檢查專案文件連結
        run: npm run check:docs
      - name: 檢查 TypeScript 型別
        run: npm run typecheck
      - name: 執行單元測試
        run: npm test
      - name: 驗證資料庫匯入與公開 API 的 OpenAPI 回應格式
        run: npm run test:integration
      - name: 準備 PostgreSQL 17 備份與還原工具
        run: |
          mkdir -p "$RUNNER_TEMP/pg-client"
          cat > "$RUNNER_TEMP/pg-client/pg-tool" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e PGSSLMODE -e PGCHANNELBINDING -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            postgres:17-alpine "$tool" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/pg-client/pg-tool"
          ln -s pg-tool "$RUNNER_TEMP/pg-client/pg_dump"
          ln -s pg-tool "$RUNNER_TEMP/pg-client/pg_restore"
          echo "PG_DUMP_BIN=$RUNNER_TEMP/pg-client/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=$RUNNER_TEMP/pg-client/pg_restore" >> "$GITHUB_ENV"
      - name: 備份並還原到隔離資料庫
        run: |
          npm run migrate
          npm run test:backup
