name: 驗證 Event Radar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 程式與資料庫測試
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: event_radar
          POSTGRES_PASSWORD: event_radar
          POSTGRES_DB: event_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_radar -d event_radar"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://event_radar:event_radar@localhost:5432/event_radar
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v7
      - name: 設定 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 安裝專案依賴
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 檢查 TypeScript 型別
        run: npm run typecheck
      - name: 執行單元測試
        run: npm test
      - name: 驗證資料庫匯入與公開 API 回應格式
        run: npm run test:integration
