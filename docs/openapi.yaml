openapi: 3.0.3
info:
  title: Event Radar 公開查詢 API
  version: 0.1.0
  description: |
    本機版 Event Radar 公開唯讀 API。限期特展、表演場次與海生館每日節目是不同資料路徑；
    各來源可能有不同觀察日期與涵蓋範圍。資料可能滯後，展期、場次與票價以館方公告為準。
    人工審核頁、匯入 CLI、Queue 操作及奇美未公開的候選資料表不屬於本 API。
tags:
  - { name: 特展, description: 已通過展期與來源驗證的公開展覽查詢 }
  - { name: 場館與參觀, description: 館所、來源狀態與保守的開館判斷 }
  - { name: 表演與海洋節目, description: 獨立於特展搜尋的多場次與當日觀察資料 }
  - { name: 人工快照, description: 人工核對的靜態展示資料，不是即時活動 API }
  - { name: 系統, description: 服務與資料庫就緒狀態 }
servers:
  - url: http://127.0.0.1:3000
paths:
  /performances:
    get:
      tags: [表演與海洋節目]
      summary: 查詢已核對的表演節目與場次
      operationId: listPerformances
      description: 手動同步讀取歌劇院 place=1 清單全部可辨識詳情（含同頁 MORE 預藏卡片，單批最多 30 筆）；按鈕行為改變時停止，不涵蓋其他篩選條件。預設只回傳尚未開始且狀態為 scheduled 或 sold_out 的場次；若已有成功的官方清單來源鍵，另排除該清單缺席的節目。異常失敗批次不取代清單基準；period=all 可查保留的舊資料及其他狀態。清單缺席不等於取消，scheduled 也不保證仍有票。
      parameters:
        - { name: source, in: query, schema: { type: string } }
        - { name: period, in: query, description: 預設 upcoming；all 回傳所有保留的節目與場次, schema: { type: string, enum: [upcoming, all], default: upcoming } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: 表演與場次清單
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainEventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /marine-programmes:
    get:
      tags: [表演與海洋節目]
      summary: 查詢海生館當日觀察到的每日節目表
      operationId: listMarineProgrammes
      description: 不帶 date 時只回傳最近一次成功匯入的節目；帶 date 時回傳指定觀察日最後接受的完整快照。observedOn 是官網當日節目表日期。歷史快照只能追查已觀察時段，不能推定未來日期或特殊開館。
      parameters:
        - { name: source, in: query, schema: { type: string } }
        - { name: date, in: query, description: 已成功觀察的日期 YYYY-MM-DD；省略時讀取最新資料, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: 每日節目表觀察結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainEventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /marine-observation-days:
    get:
      tags: [表演與海洋節目]
      summary: 查詢海生館已保存完整快照的觀察日期
      operationId: listMarineObservationDays
      description: 僅列成功匯入且自第 023 migration 起保存快照的日期；versionCount 表示同日被接受的不同內容版本數，失敗或異常批次不列入。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: 已保存快照的觀察日期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarineObservationDayList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /chimei-activities.json:
    get:
      tags: [人工快照]
      summary: 奇美活動人工核對快照（靜態檔，非即時搜尋 API）
      operationId: getChimeiActivitySnapshot
      description: |
        本機人工更新的候選清單；日期原文可能含售票日、多場次或僅時段。
        不提供即時場次、已取消或售罄保證，活動詳情以奇美博物館官方頁為準。
      responses:
        '200':
          description: 人工核對的活動快照
          content:
            application/json:
              schema:
                type: object
                required: [checkedAt, sourceUrl, items]
                properties:
                  checkedAt: { type: string, format: date-time }
                  sourceUrl: { type: string, format: uri }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, dateText, type, sourceUrl]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        dateText: { type: string }
                        type: { type: string, nullable: true }
                        sourceUrl: { type: string, format: uri }
  /health:
    get:
      tags: [系統]
      summary: 檢查服務與資料庫就緒狀態
      operationId: getHealth
      responses:
        '200':
          description: 資料庫可查詢
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [ok] }
        '503': { $ref: '#/components/responses/NotReady' }
  /museums:
    get:
      tags: [場館與參觀]
      summary: 列出博物館、來源狀態與一般入館票資訊
      operationId: listMuseums
      description: sourceStatus、dataStatus、coverageStatus 與 pendingReviewCount 各自描述來源類型、新鮮度、完整度與待審數；近期成功不表示清單完整。
      responses:
        '200':
          description: 博物館列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Museum' }
        '500': { $ref: '#/components/responses/InternalError' }
  /visit-status:
    get:
      tags: [場館與參觀]
      summary: 查指定日期的開館狀態或官方核對入口
      operationId: getVisitStatus
      description: 無可靠逐日資料時回 unknown 並提供官方入口；不以展覽或節目日期推論當日開館。
      parameters:
        - name: museum
          in: query
          required: true
          schema: { type: string }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 無法可靠確認時，status 為 unknown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exhibitions:
    get:
      tags: [特展]
      summary: 搜尋特展
      operationId: listExhibitions
      description: |
        預設只顯示尚未結束且非模擬的可見展覽。q 為不區分大小寫的字面子字串；
        from/to 與展期交集；admission=free 只匹配來源明確標示免費的資料。
      parameters:
        - { name: city, in: query, schema: { type: string, maxLength: 100 } }
        - { name: museum, in: query, schema: { type: string, maxLength: 100 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - name: status
          in: query
          schema: { type: string, enum: [active, ongoing, upcoming, ended, all], default: active }
        - name: admission
          in: query
          schema: { type: string, enum: [all, free], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: includeSample
          in: query
          description: 僅供開發驗證模擬展覽
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 搜尋結果
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Exhibition' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exhibitions/{id}:
    get:
      tags: [特展]
      summary: 特展詳情
      operationId: getExhibition
      parameters:
        - { $ref: '#/components/parameters/ExhibitionId' }
        - name: asOf
          in: query
          schema: { type: string, format: date }
        - name: includeSample
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 特展
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exhibition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exhibitions/{id}/changes:
    get:
      tags: [特展]
      summary: 最近 100 筆欄位異動
      operationId: listExhibitionChanges
      parameters:
        - { $ref: '#/components/parameters/ExhibitionId' }
        - name: includeSample
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 異動列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExhibitionChange' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exhibitions/{id}/art-changes:
    get:
      tags: [特展]
      summary: 最近 100 筆美術展欄位異動
      operationId: listArtExhibitionChanges
      parameters:
        - { $ref: '#/components/parameters/ExhibitionId' }
        - name: includeSample
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 美術展異動列表；一般博物館展覽回傳空陣列
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ArtExhibitionChange' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    ExhibitionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 請求參數無效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 找不到可見的特展
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotReady:
      description: 資料庫暫不可查詢
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 非預期伺服器錯誤
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    MarineObservationDayList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarineObservationDay' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    MarineObservationDay:
      type: object
      required: [date, versionCount, lastCheckedAt]
      properties:
        date: { type: string, format: date }
        versionCount: { type: integer, minimum: 1 }
        lastCheckedAt: { type: string, format: date-time }
    DomainEventList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DomainEvent' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    DomainEvent:
      type: object
      description: 表演與海洋節目的共通回應；由 domain 決定 sessions 或 dailySchedule 哪一組有值，與限期特展模型分開。
      required: [id, sourceId, sourceKey, domain, title, venue, sourceUrl, ticketUrl, priceNote, sourceCheckedAt, observedOn, sessions, dailySchedule]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, enum: [ntt, nmmba] }
        sourceKey: { type: string }
        domain: { type: string, enum: [performance, marine] }
        title: { type: string }
        venue: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri }
        ticketUrl: { type: string, format: uri, nullable: true }
        priceNote: { type: string, nullable: true }
        sourceCheckedAt: { type: string, format: date-time, description: 最近一次成功匯入此筆節目的核對時間，不保證館方未再變更 }
        observedOn: { type: string, format: date, nullable: true, description: 海生館官網當日節目頁的觀察日期；表演為 null }
        sessions:
          type: array
          nullable: true
          description: 表演場次；海洋節目為 null
          items: { $ref: '#/components/schemas/EventSession' }
        dailySchedule:
          type: array
          nullable: true
          description: 海洋節目當次觀察到的每日時刻；表演為 null，且不能推定未來日期
          items: { $ref: '#/components/schemas/DailySchedule' }
    EventSession:
      type: object
      required: [sessionKey, startsAt, hall, ticketUrl, priceMin, priceMax, status, statusOrigin, statusEvidenceUrl, statusReviewedAt]
      properties:
        sessionKey: { type: string, description: 同來源節目的場次識別鍵 }
        startsAt: { type: string, format: date-time }
        hall: { type: string, nullable: true }
        ticketUrl: { type: string, format: uri, nullable: true }
        priceMin: { type: integer, minimum: 0, nullable: true }
        priceMax: { type: integer, minimum: 0, nullable: true }
        status: { type: string, enum: [scheduled, sold_out, cancelled, postponed, unknown], description: scheduled 僅表示來源列有場次，不表示尚有餘票 }
        statusOrigin: { type: string, enum: [source, manual], description: manual 表示站長依館方證據逐場核對 }
        statusEvidenceUrl: { type: string, format: uri, nullable: true }
        statusReviewedAt: { type: string, format: date-time, nullable: true }
    DailySchedule:
      type: object
      required: [localTime, durationMinutes, venue, timezone]
      properties:
        localTime: { type: string }
        durationMinutes: { type: integer, minimum: 1, nullable: true }
        venue: { type: string, nullable: true }
        timezone: { type: string, enum: [Asia/Taipei] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    PriceGuide:
      type: object
      required: [label, price, infoUrl, purchaseUrl, checkedOn, note]
      properties:
        label: { type: string }
        price: { type: string }
        infoUrl: { type: string, format: uri }
        purchaseUrl: { type: string, format: uri, nullable: true }
        checkedOn: { type: string, format: date }
        note: { type: string }
    Museum:
      type: object
      required: [id, name, city, venueType, homepageUrl, sourceStatus, lastSuccessAt, lastOfficialSuccessAt, lastAttemptStatus, lastAttemptAt, coverageStatus, pendingReviewCount, dataStatus, generalAdmission]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        venueType: { type: string, enum: [museum, art_museum] }
        homepageUrl: { type: string, format: uri }
        sourceStatus: { type: string, enum: [curated, open_data, official_page, planned], description: 資料取得方式，與新鮮度及完整度分開 }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastOfficialSuccessAt: { type: string, format: date-time, nullable: true, description: 最後成功取得並匯入官方來源的時間；手動快照不刷新此值 }
        lastAttemptStatus: { type: string, enum: [succeeded, failed], nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        coverageStatus: { type: string, enum: [baseline_created, checked, deferred_partial], nullable: true, description: 來源清單完整度檢查；recent 不表示 checked }
        pendingReviewCount: { type: integer, minimum: 0, description: 待審來源列數，可能包含歷史資料，不是當期漏展數 }
        dataStatus: { type: string, enum: [manual, planned, never, untracked, failed, stale, recent], description: 來源最近官方成功與嘗試情況，與 sourceStatus 分開 }
        generalAdmission:
          description: 未核對一般入館票時為 null
          type: object
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/PriceGuide' }
    Exhibition:
      type: object
      required: [id, title, museumId, museumName, city, sourceStatus, venue, startDate, endDate, priceNote, sourceUrl, summary, lastSeenAt, isSample, exhibitionStatus, admissionStatus, ticketing, art]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        museumId: { type: string }
        museumName: { type: string }
        city: { type: string }
        sourceStatus: { type: string, enum: [curated, open_data, official_page, planned] }
        venue: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        priceNote: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri }
        summary: { type: string, nullable: true }
        lastSeenAt: { type: string, format: date-time }
        isSample: { type: boolean }
        exhibitionStatus: { type: string, enum: [ongoing, upcoming, ended] }
        admissionStatus: { type: string, enum: [free, unknown], description: 僅來源明確標示免費才為 free；unknown 不等於收費 }
        art:
          description: 只有已核對的美術館展覽有資料，其餘為 null
          type: object
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/ArtExhibitionDetails' }
        ticketing:
          type: object
          description: exhibition 是該展票價；generalAdmission 是館所一般入場資訊，兩者不可互代
          required: [exhibition, generalAdmission]
          properties:
            exhibition:
              type: object
              nullable: true
              allOf:
                - { $ref: '#/components/schemas/PriceGuide' }
            generalAdmission:
              type: object
              nullable: true
              allOf:
                - { $ref: '#/components/schemas/PriceGuide' }
    ArtExhibitionDetails:
      type: object
      required: [artistNames, curatorNames, exhibitionType, venueArea, floor, relatedEvents]
      properties:
        artistNames: { type: array, items: { type: string } }
        curatorNames: { type: array, items: { type: string } }
        exhibitionType: { type: string, enum: [temporary, education, biennial] }
        venueArea: { type: string, nullable: true }
        floor: { type: string, nullable: true }
        relatedEvents:
          type: array
          items: { $ref: '#/components/schemas/ArtRelatedEvent' }
    ArtRelatedEvent:
      type: object
      required: [title, sourceUrl, eventType]
      properties:
        title: { type: string }
        sourceUrl: { type: string, format: uri }
        eventType: { type: string, enum: [lecture, guided_tour, workshop, other] }
    ExhibitionChange:
      type: object
      required: [field, oldValue, newValue, detectedAt]
      properties:
        field: { type: string, enum: [title, venue, startDate, endDate, priceNote, sourceUrl, summary] }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        detectedAt: { type: string, format: date-time }
    ArtChangeValue:
      nullable: true
      anyOf:
        - { type: string }
        - { type: array, items: { type: string } }
        - { type: array, items: { $ref: '#/components/schemas/ArtRelatedEvent' } }
    ArtExhibitionChange:
      type: object
      required: [field, oldValue, newValue, detectedAt]
      properties:
        field: { type: string, enum: [artistNames, curatorNames, exhibitionType, venueArea, floor, relatedEvents] }
        oldValue: { $ref: '#/components/schemas/ArtChangeValue' }
        newValue: { $ref: '#/components/schemas/ArtChangeValue' }
        detectedAt: { type: string, format: date-time }
    VisitStatus:
      type: object
      required: [museumId, date, status, message, sourceUrl]
      properties:
        museumId: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [open, closed, unknown], description: unknown 表示缺少可可靠判定指定日期的官方資料 }
        message: { type: string }
        sourceUrl: { type: string, format: uri }
        newsUrl: { type: string, format: uri }
        checkedAt: { type: string, format: date-time }
