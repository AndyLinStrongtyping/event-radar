# Starter public beta. Keep database migrations separate from the build.
# Do not deploy schema changes without a fresh backup and compatibility review.
services:
  - type: web
    name: event-radar-preview
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev --ignore-scripts --no-audit --no-fund && npm run build:web
    preDeployCommand: npm run migrate
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
